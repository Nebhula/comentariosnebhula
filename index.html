<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔮 Oráculo Ancestral Dinámico</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cinzel', 'Georgia', serif;
            background: radial-gradient(circle at center, #1b0e3a 0%, #07030f 100%);
            color: #fff;
            min-height: 100vh;
            width: 100%;
        }

        .tarot-app-container {
            width: 100%;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .tarot-header { text-align: center; margin-bottom: 25px; }
        .tarot-title { 
            color: #f3cf65; 
            font-size: clamp(22px, 5vw, 30px); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin: 0 0 6px 0; 
        }
        .tarot-title i { margin-right: 8px; }
        .tarot-subtitle { 
            color: #b4a5cb; 
            font-size: clamp(11px, 2vw, 13px); 
            font-style: italic; 
            margin: 0; 
            font-family: sans-serif; 
        }
        .section-title { 
            color: #f3cf65; 
            font-size: clamp(14px, 3vw, 16px); 
            margin: 0 0 20px 0; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px solid #412375; 
            padding-bottom: 8px; 
            text-align: center; 
        }
        .section-title i { margin-right: 6px; }

        .tarot-form { 
            background: rgba(25, 13, 50, 0.4); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #412375; 
            margin-bottom: 25px; 
            max-width: 850px; 
            margin-left: auto; 
            margin-right: auto; 
        }
        .form-group { margin-bottom: 16px; text-align: left; }
        .form-group label { 
            display: block; 
            color: #cdbeea; 
            font-size: 11px; 
            text-transform: uppercase; 
            margin-bottom: 6px; 
            letter-spacing: 1px; 
            font-family: sans-serif; 
            font-weight: bold; 
        }
        .form-group label i { margin-right: 5px; width: 14px; text-align: center; }
        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%; 
            padding: 12px; 
            background: #07030f !important; 
            border: 1px solid #563399; 
            border-radius: 8px; 
            color: #fff !important; 
            font-size: 14px; 
            font-family: sans-serif;
        }
        .form-group select { cursor: pointer; }
        .form-group select option { background: #1b0e3a; color: #fff; }

        .tarot-tapete-zone { 
            background: rgba(15, 7, 30, 0.5); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px dashed #412375; 
            margin-bottom: 25px; 
            text-align: center; 
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        .status-box { 
            background: #07030f; 
            padding: 12px 18px; 
            border-radius: 8px; 
            border-left: 3px solid #f3cf65; 
            color: #ded4ef; 
            font-size: 12px; 
            font-family: sans-serif; 
            display: inline-block; 
            margin-bottom: 18px; 
            width: auto; 
            min-width: 280px;
            max-width: 600px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: all 0.4s ease;
        }
        .status-box i { margin-right: 6px; }
        .status-box.highlight { 
            border-left-color: #f3cf65; 
            background: #1f1042; 
            color: #fff; 
            box-shadow: 0 0 25px rgba(243,207,101,0.4); 
        }

        .selection-slots { 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            gap: clamp(20px, 4vw, 35px); 
            margin: 20px auto; 
            flex-wrap: wrap; 
            min-height: 300px; 
            transition: all 0.5s ease;
        }

        .slot-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .slot-label {
            font-size: clamp(9px, 1.8vw, 11px);
            text-transform: uppercase;
            color: #a595be;
            font-weight: bold;
            letter-spacing: 1px;
            font-family: sans-serif;
            text-align: center;
            min-height: 16px;
            transition: all 0.3s ease;
        }
        .slot-label.revealed {
            color: #f3cf65;
            text-shadow: 0 0 8px rgba(243,207,101,0.5);
        }

        .slot-horizontal {
            width: clamp(140px, 40vw, 200px); 
            height: clamp(220px, 60vw, 320px); 
            border: 2px dashed #412375; 
            border-radius: 12px;
            background: rgba(25, 13, 50, 0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #a595be; 
            perspective: 1000px;
            transition: all 0.4s ease; 
            backdrop-filter: blur(5px);
            overflow: hidden;
        }
        .slot-horizontal:hover { border-color: #7857c5; box-shadow: 0 0 20px rgba(120,87,197,0.3); }

        .slot-cruz {
            width: clamp(100px, 28vw, 140px); 
            height: clamp(160px, 45vw, 220px); 
            border: 2px dashed #412375; 
            border-radius: 12px;
            background: rgba(25, 13, 50, 0.3); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #a595be; 
            perspective: 1000px;
            transition: all 0.4s ease;
            overflow: hidden;
        }
        .slot-cruz:hover { border-color: #7857c5; box-shadow: 0 0 15px rgba(120,87,197,0.3); }

        .slot-horizontal.filled, .slot-cruz.filled { 
            border-style: solid; 
            border-color: #f3cf65; 
            background: #221247; 
            box-shadow: 0 0 25px rgba(243,207,101,0.4);
            animation: pulseSlot 2s ease-in-out infinite;
        }

        .slot-placeholder {
            font-size: clamp(28px, 6vw, 40px);
            opacity: 0.5;
            transition: all 0.3s ease;
        }

        @keyframes pulseSlot {
            0%, 100% { box-shadow: 0 0 25px rgba(243,207,101,0.4); }
            50% { box-shadow: 0 0 40px rgba(243,207,101,0.7); }
        }

        .card-flip-box { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }
        .card-flip-box.is-flipped { transform: rotateY(180deg); }
        .card-side { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            overflow: hidden; 
            border-radius: 10px;
        }
        .card-side-back { 
            background: linear-gradient(135deg, #170c31 0%, #0d0520 100%); 
            border: 2px solid #f3cf65; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: clamp(24px, 5vw, 36px); 
            color: #f3cf65; 
            box-shadow: inset 0 0 30px rgba(243,207,101,0.1);
            background-image: radial-gradient(circle at 30% 30%, rgba(243,207,101,0.15) 0%, transparent 50%);
        }
        .card-side-front { 
            transform: rotateY(180deg); 
            background: #000; 
        }
        .card-side-front img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block; 
            border-radius: 10px;
        }

        .deck-container { 
            background: rgba(7, 3, 15, 0.6); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid #412375; 
            margin-bottom: 25px; 
            text-align: center; 
            position: relative;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }
        .action-trigger-zone { margin-bottom: 25px; }

        .split-decks-wrapper { 
            display: none; 
            justify-content: center; 
            align-items: center; 
            gap: clamp(40px, 10vw, 120px); 
            margin: 25px 0; 
            perspective: 1200px; 
            flex-wrap: wrap; 
        }
        .tarot-pile {
            width: clamp(110px, 25vw, 140px); 
            height: clamp(160px, 40vw, 210px); 
            position: relative; 
            cursor: pointer;
            background: linear-gradient(135deg, rgba(34, 18, 71, 0.5) 0%, rgba(20, 10, 40, 0.8) 100%);
            border-radius: 12px; 
            border: 2px solid #412375;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1); 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: flex-end; 
            padding-bottom: 12px; 
            transform-style: preserve-3d; 
            transform: rotateX(15deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .tarot-pile::before {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            background: radial-gradient(circle at 50% 0%, rgba(243,207,101,0.1) 0%, transparent 70%);
            border-radius: 12px; 
            pointer-events: none;
        }
        .tarot-pile:hover { 
            border-color: #f3cf65; 
            box-shadow: 0 15px 40px rgba(243,207,101,0.5); 
            transform: rotateX(8deg) translateY(-10px) scale(1.05); 
        }
        .tarot-pile.chosen {
            border-color: #f3cf65 !important; 
            box-shadow: 0 0 40px rgba(243,207,101,0.8) !important;
            transform: rotateX(5deg) translateY(-15px) scale(1.08) !important;
            animation: chosenGlow 1.5s ease-in-out infinite;
        }
        .tarot-pile.discarded {
            opacity: 0.25; 
            pointer-events: none; 
            transform: rotateX(15deg) scale(0.85);
            filter: grayscale(80%); 
            border-color: #1a0a30;
        }

        @keyframes chosenGlow {
            0%, 100% { box-shadow: 0 0 40px rgba(243,207,101,0.8); }
            50% { box-shadow: 0 0 70px rgba(243,207,101,1), 0 0 100px rgba(243,207,101,0.4); }
        }

        .pile-label { 
            font-size: clamp(10px, 2vw, 13px); 
            color: #f3cf65; 
            text-transform: uppercase; 
            font-weight: bold; 
            z-index: 10; 
            letter-spacing: 1px; 
            background: rgba(7, 3, 15, 0.9); 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid #f3cf65; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8); 
            margin-bottom: 4px;
        }
        .pile-label i { margin-right: 5px; }

        .pile-cards-stack { 
            width: 70px; 
            height: 110px; 
            position: absolute; 
            top: 25px; 
            transform-style: preserve-3d; 
        }
        .stacked-shadow-card {
            position: absolute; 
            width: 100%; 
            height: 100%;
            background: linear-gradient(135deg, #170c31 0%, #0d0520 100%);
            border: 1px solid #f3cf65; 
            border-radius: 8px;
            background-image: radial-gradient(rgba(243, 207, 101, 0.2) 15%, transparent 16%); 
            background-size: 6px 6px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6); 
            transition: all 0.3s;
        }

        .cards-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: clamp(10px, 2vw, 15px); 
            margin-top: 15px; 
            position: relative; 
            min-height: 280px; 
            perspective: 1000px;
            padding: 20px; 
            background: rgba(0,0,0,0.3); 
            border-radius: 16px;
            border: 1px solid rgba(65, 35, 117, 0.3);
            transition: all 0.5s ease;
        }

        .mini-card {
            width: clamp(58px, 16vw, 75px); 
            height: clamp(92px, 26vw, 122px); 
            background: linear-gradient(135deg, #1a0e38 0%, #0d0520 100%);
            background-image: 
                radial-gradient(circle at 40% 40%, rgba(243, 207, 101, 0.2) 0%, transparent 50%),
                linear-gradient(45deg, rgba(243,207,101,0.05) 25%, transparent 25%, transparent 75%, rgba(243,207,101,0.05) 75%);
            background-size: 100% 100%, 8px 8px;
            border: 2px solid #563399; 
            border-radius: 10px;
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: clamp(16px, 4vw, 22px); 
            color: #f3cf65;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5); 
            position: relative;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            animation: floatCard 3s ease-in-out infinite;
        }
        .mini-card:nth-child(odd) { animation-delay: 0.5s; }
        .mini-card:nth-child(3n) { animation-delay: 1s; }
        .mini-card:nth-child(5n+2) { animation-delay: 1.5s; }
        .mini-card:nth-child(7n+4) { animation-delay: 0.7s; }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }

        .mini-card:hover { 
            border-color: #f3cf65; 
            transform: translateY(-15px) scale(1.12) !important; 
            z-index: 20; 
            box-shadow: 0 15px 30px rgba(243,207,101,0.6);
            animation: none;
            background: linear-gradient(135deg, #2a1550 0%, #150830 100%);
        }
        .mini-card.selected { 
            opacity: 0.1; 
            pointer-events: none; 
            transform: scale(0.6) rotateY(90deg) !important; 
            filter: blur(2px); 
            transition: all 0.6s ease;
        }

        .cards-grid.rotating-vortex { 
            animation: spinWheel 1s linear infinite;
            position: relative;
        }
        .cards-grid.rotating-vortex .mini-card {
            animation: vortexCard 1s ease-in-out infinite;
        }

        @keyframes spinWheel { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        @keyframes vortexCard {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.8) drop-shadow(0 0 15px rgba(243,207,101,0.8)); }
        }

        .mystic-particles {
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            pointer-events: none; 
            overflow: hidden; 
            border-radius: 16px; 
            z-index: 1;
        }
        .particle {
            position: absolute; 
            width: 3px; 
            height: 3px; 
            background: #f3cf65;
            border-radius: 50%; 
            animation: riseParticle 2s ease-in infinite;
            opacity: 0;
        }
        @keyframes riseParticle {
            0% { transform: translateY(100%) scale(0); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-100%) scale(1.5); opacity: 0; }
        }

        .btn-primary-tarot { 
            background: linear-gradient(135deg, #f3cf65 0%, #b89223 100%); 
            color: #07030f; 
            border: none; 
            padding: clamp(14px, 2vw, 18px) clamp(35px, 6vw, 55px); 
            font-size: clamp(13px, 2vw, 16px); 
            font-family: 'Cinzel', serif; 
            font-weight: bold; 
            border-radius: 35px; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 8px 25px rgba(243,207,101,0.4); 
            letter-spacing: 2px; 
            display: inline-block; 
            transition: all 0.3s ease;
            position: relative; 
            overflow: hidden;
        }
        .btn-primary-tarot i { margin-right: 8px; }
        .btn-primary-tarot::after {
            content: ''; 
            position: absolute; 
            top: -50%; 
            left: -50%; 
            width: 200%; 
            height: 200%;
            background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
            animation: shimmer 3s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        .btn-primary-tarot:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 12px 35px rgba(243,207,101,0.7); 
        }
        .btn-primary-tarot:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            filter: grayscale(50%);
        }
        .btn-primary-tarot:disabled:hover {
            transform: none;
            box-shadow: 0 8px 25px rgba(243,207,101,0.4);
        }

        .whatsapp-btn { 
            display: none; 
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); 
            color: #fff !important; 
            text-decoration: none; 
            padding: clamp(14px, 2vw, 18px) clamp(30px, 5vw, 45px); 
            font-size: clamp(13px, 2vw, 16px); 
            font-weight: bold; 
            border-radius: 40px; 
            text-transform: uppercase; 
            box-shadow: 0 10px 30px rgba(37,211,102,0.5); 
            margin: 15px auto; 
            max-width: 360px; 
            text-align: center; 
            font-family: sans-serif;
            transition: all 0.3s ease; 
            animation: pulseBtn 2s ease-in-out infinite;
        }
        @keyframes pulseBtn {
            0%, 100% { box-shadow: 0 10px 30px rgba(37,211,102,0.5); }
            50% { box-shadow: 0 15px 45px rgba(37,211,102,0.8); }
        }
        .whatsapp-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(37,211,102,0.8); }
        .whatsapp-btn i { font-size: clamp(18px, 3vw, 22px); vertical-align: middle; margin-right: 10px; }

        @media (max-width: 768px) {
            .tarot-app-container { padding: 15px 10px; }
            .tarot-form, .tarot-tapete-zone, .deck-container { padding: 15px; }
            .selection-slots { gap: 15px; }
            .split-decks-wrapper { gap: 40px; }
        }

        @media (max-width: 480px) {
            .tarot-app-container { padding: 10px 8px; }
            .tarot-title { font-size: 20px; }
            .split-decks-wrapper { 
                flex-direction: column; 
                gap: 25px; 
            }
            .cards-grid { gap: 8px; padding: 12px; }
            .status-box { min-width: auto; width: 100%; font-size: 11px; }
        }
    </style>
</head>
<body>
    <div class="tarot-app-container">
        <div class="tarot-header">
            <h2 class="tarot-title"><i class="fas fa-eye"></i> Oráculo Ancestral Dinámico</h2>
            <p class="tarot-subtitle">Introduce tus datos, divide el mazo y consulta tu destino</p>
        </div>

        <div class="tarot-form">
            <h3 class="section-title"><i class="fas fa-star"></i> Datos de Conexión</h3>
            <div class="form-group">
                <label for="tName"><i class="fas fa-user"></i> Nombre Completo:</label>
                <input type="text" id="tName" placeholder="Ej: María García">
            </div>
            <div class="form-group">
                <label for="tBirth"><i class="fas fa-calendar-alt"></i> Fecha de Nacimiento o Signo:</label>
                <input type="text" id="tBirth" placeholder="Ej: 24 de Abril / Escorpio">
            </div>
            <div class="form-group">
                <label for="tReadingType"><i class="fas fa-crystal-ball"></i> Tipo de Consulta Astral:</label>
                <select id="tReadingType" onchange="cambiarTipoLectura()">
                    <option value="1">Respuesta Inmediata (1 Carta - Sí o No)</option>
                    <option value="3" selected>Línea Temporal Completa (3 Cartas - Pasado, Presente, Futuro)</option>
                    <option value="5">Oráculo de la Cruz Simple (5 Cartas - Análisis Profundo)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tQuestion"><i class="fas fa-question-circle"></i> Tu Pregunta Sagrada:</label>
                <textarea id="tQuestion" rows="3" placeholder="Escribe aquí tu consulta en detalle para el vidente..."></textarea>
            </div>
        </div>

        <div class="tarot-tapete-zone" id="anclajeTapete">
            <h3 class="section-title"><i class="fas fa-hand-sparkles"></i> Tu Alineación Sagrada</h3>
            <div class="status-box" id="gameStatus">
                <i class="fas fa-info-circle"></i> Rellena tus datos arriba y baja al mazo inferior para barajar los arcanos.
            </div>
            <div class="selection-slots" id="slotsContainer"></div>
        </div>

        <div class="deck-container" id="anclajeMazo">
            <h3 class="section-title"><i class="fas fa-layer-group"></i> El Mazo del Destino</h3>
            <div class="action-trigger-zone">
                <button class="btn-primary-tarot" id="btnMezclar" onclick="arrancarMazo()"><i class="fas fa-shuffle"></i> Mezclar y Partir Mazo</button>
            </div>
            <div class="split-decks-wrapper" id="pilesWrapper">
                <div class="tarot-pile" id="pileLeft" onclick="abrirMonton('izq')">
                    <div class="pile-label"><i class="fas fa-gem"></i> Mazo A</div>
                    <div class="pile-cards-stack" id="stackLeft"></div>
                </div>
                <div class="tarot-pile" id="pileRight" onclick="abrirMonton('der')">
                    <div class="pile-label"><i class="fas fa-gem"></i> Mazo B</div>
                    <div class="pile-cards-stack" id="stackRight"></div>
                </div>
            </div>
            <div class="cards-grid" id="deckGrid"></div>
        </div>

        <div class="footer-action-area" style="text-align:center;">
            <a href="#" id="wsBtn" class="whatsapp-btn" target="_blank">
                <i class="fab fa-whatsapp"></i> ENVIAR LECTURA AL VIDENTE REAL
            </a>
        </div>
    </div>

    <script>
        // ⚡ CONFIGURACIÓN
        var TELEFONO_VIDENTE = "34600000000"; 
        var HORAS_ESPERA = 24; // Cambia aquí las horas entre tiradas (24 = 1 día, 48 = 2 días)
        var IMAGEN_TEMPORAL = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhwCaxJhtnLruTPz99yqEwcUe-P9RjWPmLbaPoYJH656pE-XhF89kkkqYBZcdgFqPCWt6Y2jZQTnqM_4ofxyp1qTy5R15hxsOlKu8Z7tpNo6M2cPWsokV7U3Ub29Uie50AIII1xYvjasm0YWNEdz-n8E2rf_nHJFsJlC_pjwPIx6jA0HUj0pOCJByept6mr/s1600/laluna.png";

        var arcanosMayores = [
            { nombre: "El Mago", img: IMAGEN_TEMPORAL },
            { nombre: "La Sacerdotisa", img: IMAGEN_TEMPORAL },
            { nombre: "La Emperatriz", img: IMAGEN_TEMPORAL },
            { nombre: "El Emperador", img: IMAGEN_TEMPORAL },
            { nombre: "El Papa", img: IMAGEN_TEMPORAL },
            { nombre: "Los Enamorados", img: IMAGEN_TEMPORAL },
            { nombre: "El Carro", img: IMAGEN_TEMPORAL },
            { nombre: "La Fuerza", img: IMAGEN_TEMPORAL },
            { nombre: "El Ermitaño", img: IMAGEN_TEMPORAL },
            { nombre: "La Rueda de la Fortuna", img: IMAGEN_TEMPORAL },
            { nombre: "La Justicia", img: IMAGEN_TEMPORAL },
            { nombre: "El Colgado", img: IMAGEN_TEMPORAL },
            { nombre: "La Muerte", img: IMAGEN_TEMPORAL },
            { nombre: "La Templanza", img: IMAGEN_TEMPORAL },
            { nombre: "El Diablo", img: IMAGEN_TEMPORAL },
            { nombre: "La Torre", img: IMAGEN_TEMPORAL },
            { nombre: "La Estrella", img: IMAGEN_TEMPORAL },
            { nombre: "La Luna", img: IMAGEN_TEMPORAL },
            { nombre: "El Sol", img: IMAGEN_TEMPORAL },
            { nombre: "El Juicio", img: IMAGEN_TEMPORAL },
            { nombre: "El Mundo", img: IMAGEN_TEMPORAL },
            { nombre: "El Loco", img: IMAGEN_TEMPORAL }
        ];

        var mazoIzquierdo = [], mazoDerecho = [], mazoActivoAbanico = [], cartasSeleccionadas = [], limiteCartas = 3;
        var mazoElegido = null;
        var tiradaCompletada = false; // Para evitar doble guardado

        var nombresPosiciones = {
            "1": ["Tu Destino"],
            "3": ["Pasado", "Presente", "Futuro"],
            "5": ["Situación Actual", "Obstáculo Oculto", "Influencia Externa", "Camino Solución", "Resultado Final"]
        };

        // ⏰ FUNCIONES DE CONTROL DE TIEMPO
        function puedeTirar() {
            var datos = JSON.parse(localStorage.getItem("tarotData") || "{}");
            if (!datos.ultimaTirada) return true;
            
            var ahora = new Date().getTime();
            var diferencia = ahora - datos.ultimaTirada;
            var horas = diferencia / (1000 * 60 * 60);
            
            return horas >= HORAS_ESPERA;
        }

        function guardarTirada() {
            if (tiradaCompletada) return; // Evitar doble guardado
            tiradaCompletada = true;
            
            var tipoLectura = document.getElementById("tReadingType").value;
            var datos = {
                ultimaTirada: new Date().getTime(),
                tipoConsulta: tipoLectura,
                fecha: new Date().toLocaleString()
            };
            localStorage.setItem("tarotData", JSON.stringify(datos));
        }

        function tiempoRestante() {
            var datos = JSON.parse(localStorage.getItem("tarotData") || "{}");
            if (!datos.ultimaTirada) return "";
            
            var ahora = new Date().getTime();
            var diferencia = ahora - datos.ultimaTirada;
            var horasPasadas = diferencia / (1000 * 60 * 60);
            var horasFaltan = HORAS_ESPERA - horasPasadas;
            
            if (horasFaltan <= 0) return "";
            
            var h = Math.floor(horasFaltan);
            var m = Math.floor((horasFaltan - h) * 60);
            
            if (h > 0 && m > 0) return h + " horas y " + m + " minutos";
            if (h > 0) return h + " horas";
            return m + " minutos";
        }

        function verificarEstadoInicial() {
            if (!puedeTirar()) {
                var statusBox = document.getElementById("gameStatus");
                var btnMezclar = document.getElementById("btnMezclar");
                var tiempo = tiempoRestante();
                
                if (statusBox) {
                    statusBox.classList.add("highlight");
                    statusBox.innerHTML = '<i class="fas fa-clock"></i> Ya has consultado al oráculo.<br><span style="font-size:11px;color:#cdbeea;">Vuelve en ' + tiempo + '</span>';
                }
                if (btnMezclar) {
                    btnMezclar.disabled = true;
                    btnMezclar.innerHTML = '<i class="fas fa-clock"></i> Espera ' + tiempo;
                    btnMezclar.style.opacity = "0.6";
                    btnMezclar.style.cursor = "not-allowed";
                }
            }
        }

        function crearParticulas(contenedor) {
            if (!contenedor) return;
            var existentes = contenedor.querySelector('.mystic-particles');
            if (existentes) existentes.remove();
            
            var particulasDiv = document.createElement('div');
            particulasDiv.className = 'mystic-particles';
            for (var p = 0; p < 15; p++) {
                var particula = document.createElement('div');
                particula.className = 'particle';
                particula.style.left = Math.random() * 100 + '%';
                particula.style.animationDelay = Math.random() * 2 + 's';
                particula.style.animationDuration = (1.5 + Math.random() * 2) + 's';
                particulasDiv.appendChild(particula);
            }
            contenedor.appendChild(particulasDiv);
        }

        function cambiarTipoLectura() {
            var selector = document.getElementById("tReadingType");
            if (!selector) return;
            limiteCartas = parseInt(selector.value);
            cartasSeleccionadas = [];
            mazoElegido = null;
            tiradaCompletada = false;
            
            if (document.getElementById("wsBtn")) document.getElementById("wsBtn").style.display = "none";
            document.getElementById("pilesWrapper").style.display = "none";
            document.getElementById("deckGrid").innerHTML = "";
            
            resetearEstilosMontones();
            
            var slotsContainer = document.getElementById("slotsContainer");
            if (slotsContainer) {
                slotsContainer.innerHTML = "";
                var etiquetas = nombresPosiciones[limiteCartas.toString()];
                
                slotsContainer.style.cssText = "";
                slotsContainer.className = "selection-slots";
                
                if (limiteCartas === 5) {
                    slotsContainer.style.display = "grid";
                    slotsContainer.style.gridTemplateColumns = "repeat(3, 1fr)";
                    slotsContainer.style.gridTemplateRows = "repeat(3, auto)";
                    slotsContainer.style.gap = "15px";
                    slotsContainer.style.justifyContent = "center";
                    slotsContainer.style.alignItems = "center";
                    slotsContainer.style.justifyItems = "center";
                    slotsContainer.style.maxWidth = "500px";
                    slotsContainer.style.margin = "0 auto";
                } else {
                    slotsContainer.style.display = "flex";
                    slotsContainer.style.justifyContent = "center";
                    slotsContainer.style.alignItems = "flex-start";
                    slotsContainer.style.gap = "25px";
                    slotsContainer.style.flexWrap = "wrap";
                    slotsContainer.style.maxWidth = "";
                    slotsContainer.style.margin = "";
                }
                
                for (var i = 0; i < limiteCartas; i++) {
                    var wrapperDiv = document.createElement("div");
                    wrapperDiv.className = "slot-wrapper";
                    wrapperDiv.id = "wrapper" + i;
                    
                    var labelDiv = document.createElement("div");
                    labelDiv.className = "slot-label";
                    labelDiv.id = "label" + i;
                    labelDiv.innerText = etiquetas[i];
                    wrapperDiv.appendChild(labelDiv);
                    
                    var slotDiv = document.createElement("div");
                    if (limiteCartas === 5) {
                        slotDiv.className = "slot-cruz";
                    } else {
                        slotDiv.className = "slot-horizontal";
                    }
                    slotDiv.id = "slot" + i;
                    slotDiv.innerHTML = '<div class="slot-placeholder"><i class="fas fa-hourglass-half"></i></div>';
                    wrapperDiv.appendChild(slotDiv);
                    
                    if (limiteCartas === 5) {
                        if (i === 0) { wrapperDiv.style.gridColumn = "2"; wrapperDiv.style.gridRow = "2"; }
                        if (i === 1) { wrapperDiv.style.gridColumn = "1"; wrapperDiv.style.gridRow = "2"; }
                        if (i === 2) { wrapperDiv.style.gridColumn = "3"; wrapperDiv.style.gridRow = "2"; }
                        if (i === 3) { wrapperDiv.style.gridColumn = "2"; wrapperDiv.style.gridRow = "1"; }
                        if (i === 4) { wrapperDiv.style.gridColumn = "2"; wrapperDiv.style.gridRow = "3"; }
                    }
                    
                    slotsContainer.appendChild(wrapperDiv);
                }
            }
            
            var statusBox = document.getElementById("gameStatus");
            var btnMezclar = document.getElementById("btnMezclar");
            
            if (!puedeTirar()) {
                var tiempo = tiempoRestante();
                if (statusBox) { 
                    statusBox.classList.add("highlight"); 
                    statusBox.innerHTML = '<i class="fas fa-clock"></i> Ya has consultado al oráculo.<br><span style="font-size:11px;color:#cdbeea;">Vuelve en ' + tiempo + '</span>'; 
                }
                if (btnMezclar) {
                    btnMezclar.disabled = true;
                    btnMezclar.innerHTML = '<i class="fas fa-clock"></i> Espera ' + tiempo;
                }
            } else {
                if (statusBox) { 
                    statusBox.classList.remove("highlight"); 
                    statusBox.innerHTML = '<i class="fas fa-eye"></i> Mazo listo. Usa el botón dorado de abajo para mezclar.'; 
                }
                if (btnMezclar) {
                    btnMezclar.disabled = false;
                    btnMezclar.innerHTML = '<i class="fas fa-shuffle"></i> Mezclar y Partir Mazo';
                    btnMezclar.style.opacity = "1";
                    btnMezclar.style.cursor = "pointer";
                }
            }
        }

        function resetearEstilosMontones() {
            var pileLeft = document.getElementById("pileLeft");
            var pileRight = document.getElementById("pileRight");
            if (pileLeft) {
                pileLeft.classList.remove("chosen", "discarded");
                pileLeft.style.opacity = "1";
                pileLeft.style.pointerEvents = "auto";
                pileLeft.style.transform = "rotateX(15deg)";
                pileLeft.style.borderColor = "#412375";
                pileLeft.style.boxShadow = "0 10px 30px rgba(0,0,0,0.6)";
            }
            if (pileRight) {
                pileRight.classList.remove("chosen", "discarded");
                pileRight.style.opacity = "1";
                pileRight.style.pointerEvents = "auto";
                pileRight.style.transform = "rotateX(15deg)";
                pileRight.style.borderColor = "#412375";
                pileRight.style.boxShadow = "0 10px 30px rgba(0,0,0,0.6)";
            }
        }

        function arrancarMazo() {
            // 🔒 COMPROBAR SI PUEDE TIRAR
            if (!puedeTirar()) {
                var statusBox = document.getElementById("gameStatus");
                var tiempo = tiempoRestante();
                if (statusBox) {
                    statusBox.classList.add("highlight");
                    statusBox.innerHTML = '<i class="fas fa-clock"></i> Ya has consultado al oráculo.<br><span style="font-size:11px;color:#cdbeea;">Vuelve en ' + tiempo + '</span>';
                }
                return;
            }
            
            cartasSeleccionadas = [];
            mazoElegido = null;
            tiradaCompletada = false;
            var grid = document.getElementById("deckGrid");
            if (!grid) return;
            
            var statusBox = document.getElementById("gameStatus");
            if (statusBox) { 
                statusBox.classList.remove("highlight"); 
                statusBox.innerHTML = '<i class="fas fa-wind"></i> Mezclando los 22 Arcanos...'; 
            }
            
            resetearEstilosMontones();
            document.getElementById("pilesWrapper").style.display = "none";
            
            grid.innerHTML = "";
            grid.style.position = "relative";
            grid.style.minHeight = "350px";
            
            var oldParticles = grid.querySelector('.mystic-particles');
            if (oldParticles) oldParticles.remove();
            
            var totalCartas = 22, radio = Math.min(window.innerWidth * 0.35, 160); 
            
            for (var i = 0; i < totalCartas; i++) {
                var cardDiv = document.createElement("div");
                cardDiv.className = "mini-card";
                cardDiv.innerHTML = '<i class="fas fa-star"></i>';
                var angulo = (i * 2 * Math.PI) / totalCartas - Math.PI/2;
                var x = Math.round(radio * Math.cos(angulo));
                var y = Math.round(radio * Math.sin(angulo));
                var rotacionGrados = Math.round(angulo * (180 / Math.PI)) + 90;
                cardDiv.style.position = "absolute";
                cardDiv.style.left = "calc(50% - 29px)";
                cardDiv.style.top = "calc(50% - 46px)";
                cardDiv.style.transform = "translate(" + x + "px, " + y + "px) rotate(" + rotacionGrados + "deg)";
                cardDiv.style.animation = "none";
                grid.appendChild(cardDiv);
            }
            
            crearParticulas(grid);
            grid.classList.add("rotating-vortex");
            
            setTimeout(function() {
                grid.classList.remove("rotating-vortex");
                grid.innerHTML = "";
                var oldParticles2 = grid.querySelector('.mystic-particles');
                if (oldParticles2) oldParticles2.remove();
                
                var todosArcanos = barajarArray(arcanosMayores);
                
                mazoIzquierdo = todosArcanos.slice(0, 10);
                mazoDerecho = todosArcanos.slice(10, 21);
                
                document.getElementById("pilesWrapper").style.display = "flex";
                construirStackVisual("stackLeft");
                construirStackVisual("stackRight");
                
                if (statusBox) { 
                    statusBox.classList.add("highlight"); 
                    statusBox.innerHTML = '<i class="fas fa-hand-pointer"></i> <strong>ELIGE UN MAZO</strong><br><span style="font-size:clamp(9px,1.5vw,11px);color:#cdbeea;">Confía en tu intuición... Mazo A o Mazo B</span>'; 
                }
                
                grid.scrollIntoView({ behavior: 'smooth' });
            }, 1800); 
        }

        function barajarArray(array) {
            var arr = array.slice();
            var current = arr.length, random, temp;
            while (current !== 0) {
                random = Math.floor(Math.random() * current);
                current--;
                temp = arr[current];
                arr[current] = arr[random];
                arr[random] = temp;
            }
            return arr;
        }

        function construirStackVisual(stackId) {
            var stack = document.getElementById(stackId);
            if (!stack) return;
            stack.innerHTML = "";
            for(var s = 0; s < 6; s++) {
                var shadowCard = document.createElement("div");
                shadowCard.className = "stacked-shadow-card";
                shadowCard.style.top = (s * -2.5) + "px"; 
                shadowCard.style.left = (s * 1.5) + "px";
                shadowCard.style.transform = "rotate(" + (Math.random() * 3 - 1.5) + "deg)";
                stack.appendChild(shadowCard);
            }
        }

        function abrirMonton(lado) {
            var grid = document.getElementById("deckGrid");
            var statusBox = document.getElementById("gameStatus");
            var pilesWrapper = document.getElementById("pilesWrapper");
            
            if (!grid) return;
            
            cartasSeleccionadas = [];
            mazoElegido = lado;
            mazoActivoAbanico = (lado === 'izq') ? mazoIzquierdo : mazoDerecho;
            
            for (var s = 0; s < limiteCartas; s++) {
                var slot = document.getElementById("slot" + s);
                var label = document.getElementById("label" + s);
                if (slot) {
                    slot.classList.remove("filled");
                    slot.innerHTML = '<div class="slot-placeholder"><i class="fas fa-hourglass-half"></i></div>';
                }
                if (label) {
                    label.classList.remove("revealed");
                    label.innerText = nombresPosiciones[limiteCartas.toString()][s];
                }
            }
            
            var pileLeft = document.getElementById("pileLeft");
            var pileRight = document.getElementById("pileRight");
            
            if (lado === 'izq') {
                pileLeft.classList.add("chosen");
                pileLeft.classList.remove("discarded");
                pileRight.classList.add("discarded");
                pileRight.classList.remove("chosen");
            } else {
                pileRight.classList.add("chosen");
                pileRight.classList.remove("discarded");
                pileLeft.classList.add("discarded");
                pileLeft.classList.remove("chosen");
            }
            
            if (statusBox) { 
                statusBox.classList.add("highlight"); 
                statusBox.innerHTML = '<i class="fas fa-hand-sparkles"></i> Has elegido el <strong>Mazo ' + (lado === 'izq' ? 'A' : 'B') + '</strong>. Ahora selecciona ' + limiteCartas + ' cartas...'; 
            }
            
            if (pilesWrapper) pilesWrapper.style.display = "none";
            
            var wsBtn = document.getElementById("wsBtn");
            if (wsBtn) wsBtn.style.display = "none";
            
            grid.innerHTML = "";
            grid.classList.remove("rotating-vortex");
            grid.style.position = "relative";
            grid.style.minHeight = "300px";
            grid.style.display = "flex";
            grid.style.flexWrap = "wrap";
            grid.style.justifyContent = "center";
            grid.style.alignItems = "center";
            grid.style.gap = "12px";
            grid.style.padding = "20px";
            
            var oldParticles = grid.querySelector('.mystic-particles');
            if (oldParticles) oldParticles.remove();
            
            crearParticulas(grid);
            
            for (var j = 0; j < mazoActivoAbanico.length; j++) {
                var cardDiv = document.createElement("div");
                cardDiv.className = "mini-card";
                cardDiv.id = "deckCard_" + j;
                cardDiv.innerHTML = '<i class="fas fa-star"></i>';
                cardDiv.setAttribute("onclick", "clickEnCartaMazo(" + j + ")");
                cardDiv.style.animation = "floatCard 3s ease-in-out infinite";
                cardDiv.style.animationDelay = (j * 0.06) + "s";
                cardDiv.style.position = "relative";
                cardDiv.style.left = "auto";
                cardDiv.style.top = "auto";
                cardDiv.style.transform = "none";
                grid.appendChild(cardDiv);
            }
            
            setTimeout(function() {
                grid.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 200);
        }

        function clickEnCartaMazo(indiceMazo) {
            if (cartasSeleccionadas.length >= limiteCartas) return;
            var celdaCarta = document.getElementById("deckCard_" + indiceMazo);
            if (!celdaCarta || celdaCarta.classList.contains("selected")) return;
            
            var objetoCarta = mazoActivoAbanico[indiceMazo];
            cartasSeleccionadas.push(objetoCarta);
            celdaCarta.classList.add("selected");
            
            var ranuraActual = cartasSeleccionadas.length - 1;
            var slotObjetivo = document.getElementById("slot" + ranuraActual);
            var labelObjetivo = document.getElementById("label" + ranuraActual);
            
            if (slotObjetivo) {
                slotObjetivo.classList.add("filled");
                
                slotObjetivo.innerHTML = '<div class="card-flip-box" id="flipBox' + ranuraActual + '" style="width:100%;height:100%;">' +
                                         '  <div class="card-side card-side-back"><i class="fas fa-star"></i></div>' +
                                         '  <div class="card-side card-side-front">' +
                                         '    <img src="' + objetoCarta.img + '" alt="' + objetoCarta.nombre + '" style="width:100%;height:100%;object-fit:cover;display:block;">' +
                                         '  </div>' +
                                         '</div>';
                
                if (labelObjetivo) {
                    labelObjetivo.classList.add("revealed");
                    labelObjetivo.innerHTML = '<i class="fas fa-star"></i> ' + objetoCarta.nombre;
                }
                
                setTimeout(function() {
                    var targetBox = document.getElementById("flipBox" + ranuraActual);
                    if(targetBox) targetBox.classList.add("is-flipped");
                }, 150);
            }
            
            document.getElementById("anclajeTapete").scrollIntoView({ behavior: 'smooth' });
            
            var statusBox = document.getElementById("gameStatus");
            if (cartasSeleccionadas.length === limiteCartas) {
                // 💾 GUARDAR TIRADA COMPLETADA
                guardarTirada();
                
                if (statusBox) {
                    statusBox.classList.add("highlight");
                    statusBox.innerHTML = '<i class="fas fa-check-circle"></i> ¡Tirada completada! Podrás volver a consultar en ' + HORAS_ESPERA + ' horas.';
                }
                armarEnlaceWhatsApp();
            } else {
                var restantes = limiteCartas - cartasSeleccionadas.length;
                if (statusBox) {
                    statusBox.classList.add("highlight");
                    statusBox.innerHTML = '<i class="fas fa-hand-sparkles"></i> Has elegido ' + cartasSeleccionadas.length + ' de ' + limiteCartas + ' cartas. Selecciona ' + restantes + ' más...';
                }
            }
        }

        function armarEnlaceWhatsApp() {
            var cNom = document.getElementById("tName").value.trim() || "Anónimo";
            var cFec = document.getElementById("tBirth").value.trim() || "No especificada";
            var cPre = document.getElementById("tQuestion").value.trim() || "Lectura general";
            var etiquetas = nombresPosiciones[limiteCartas.toString()];
            
            var msg = "🔮 *LECTURA DE TAROT INTERACTIVO* 🔮\n\n" +
            "👤 *Nombre:* " + cNom + "\n" +
            "📅 *Signo/Fecha:* " + cFec + "\n" +
            "🎴 *Mazo elegido:* " + (mazoElegido === 'izq' ? 'Mazo A' : 'Mazo B') + "\n" +
            "🔮 *Consulta:* " + cPre + "\n\n" +
            "🃏 *ARCANOS REVELADOS* (" + limiteCartas + " cartas):\n";
            
            for (var m = 0; m < cartasSeleccionadas.length; m++) {
                msg += "  • *" + etiquetas[m] + "* → " + cartasSeleccionadas[m].nombre + "\n";
            }
            
            msg += "\n_Solicito mi interpretación real por este chat de WhatsApp._";
            
            var link = "https://wa.me/" + TELEFONO_VIDENTE + "?text=" + encodeURIComponent(msg);
            var btn = document.getElementById("wsBtn");
            if (btn) { 
                btn.href = link; 
                btn.style.display = "block";
            }
        }

        window.onload = function() {
            cambiarTipoLectura();
            verificarEstadoInicial();
        };
    </script>
