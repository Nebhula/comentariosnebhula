<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Oráculo de Nebhula - Tirada de Una Carta</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'Cinzel', serif;
            background: linear-gradient(135deg, #0f0c1f 0%, #1a0f2e 50%, #0b0719 100%);
            color: #fff;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Estrellas de fondo */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 60px 90px, #f3cf65, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 120px 50px, #fff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 200px 150px, #b4a5cb, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, #fff, rgba(0,0,0,0));
            background-size: 400px 400px;
            background-repeat: repeat;
            opacity: 0.3;
            pointer-events: none;
            z-index: 0;
        }

        .tarot-app-container { 
            width: 100%; 
            min-height: 100vh; 
            padding: 16px 12px; 
            position: relative;
            z-index: 1;
        }

        /* HEADER */
        .tarot-header { text-align: center; margin-bottom: 20px; }
        .tarot-title { 
            color: #ffffff; 
            font-size: 18px; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            flex-wrap: wrap;
            font-weight: 600;
        }
        .tarot-title img { 
            width: 35px; 
            height: 35px; 
            object-fit: contain; 
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            padding: 5px;
        }
        .tarot-subtitle { 
            color: #b4a5cb; 
            font-size: 11px; 
            font-style: italic;
            letter-spacing: 1px;
        }
        .section-title { 
            color: #ffffff; 
            font-size: 14px; 
            margin: 0 0 15px 0; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            border-bottom: 1px solid rgba(180,165,203,0.3); 
            padding-bottom: 6px; 
            text-align: center;
            font-weight: 500;
        }

        /* INSTRUCCIONES */
        .instrucciones-container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 20px;
            text-align: center;
        }
        .instrucciones-container h3 {
            color: #f3cf65;
            margin-bottom: 15px;
            font-size: 16px;
            font-family: 'Cinzel', serif;
        }
        .paso { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 12px; 
            margin: 15px 0; 
            flex-wrap: wrap; 
        }
        .paso-icono { 
            width: 40px; 
            height: 40px; 
            background: rgba(243,207,101,0.15);
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 18px; 
            color: #f3cf65; 
        }
        .paso-texto { 
            font-size: 13px; 
            color: #cdbeea; 
            max-width: 220px; 
            text-align: left;
            font-weight: 300;
        }
        .frase-meditacion { 
            font-style: italic; 
            color: #f3cf65; 
            margin: 15px 0 10px 0; 
            font-size: 13px; 
            letter-spacing: 1px;
            font-family: 'Cinzel', serif;
        }
        .btn-comenzar { 
            background: linear-gradient(135deg, #f3cf65 0%, #c9a53b 100%);
            color: #0f0c1f; 
            border: none; 
            padding: 14px 30px; 
            font-size: 14px; 
            font-family: 'Cinzel', serif; 
            font-weight: bold; 
            border-radius: 50px; 
            cursor: pointer; 
            text-transform: uppercase; 
            box-shadow: 0 4px 15px rgba(243,207,101,0.3);
            letter-spacing: 2px; 
            transition: all 0.3s ease; 
            margin-top: 10px;
            width: 100%;
            max-width: 250px;
        }
        .btn-comenzar:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 8px 25px rgba(243,207,101,0.5);
        }

        /* ZONA DE CARTA */
        .tarot-tapete-zone { 
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(5px);
            padding: 16px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px; 
            text-align: center; 
            display: none; 
        }
        .status-box { 
            background: rgba(0,0,0,0.5); 
            padding: 10px 16px; 
            border-radius: 12px; 
            border-left: 3px solid #f3cf65; 
            color: #ded4ef; 
            font-size: 11px; 
            display: inline-block; 
            margin-bottom: 15px; 
            width: 100%;
            max-width: 100%;
            text-transform: uppercase; 
            letter-spacing: 1px; 
        }
        .status-box.highlight { 
            border-left-color: #f3cf65; 
            background: rgba(243,207,101,0.1); 
            color: #fff; 
        }

        .carta-unica-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            margin: 15px 0; 
        }
        .slot-carta {
            width: 280px;
            height: 394px;
            border: none;
            border-radius: 20px;
            background: rgba(25, 13, 50, 0.5);
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
            overflow: hidden;
            margin: 0 auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        @media (max-width: 650px) {
            .slot-carta { width: 260px; height: 366px; }
        }
        
        @media (max-width: 480px) {
            .slot-carta { width: 240px; height: 338px; }
        }

        .slot-carta:hover { transform: translateY(-5px); }
        .slot-carta.filled { background: #0a0520; box-shadow: 0 0 30px rgba(243,207,101,0.3); }

        .slot-placeholder { 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
        }
        .slot-placeholder .card-back-texture {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(42,26,74,0.8), rgba(15,7,37,0.9));
            backdrop-filter: blur(5px);
            border-radius: 18px;
            position: relative;
        }
        .slot-placeholder .card-back-texture::before {
            content: "";
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(243,207,101,0.2);
            border-radius: 12px;
            pointer-events: none;
        }
        .slot-placeholder img { 
            width: 65px; 
            height: 65px; 
            object-fit: contain; 
            opacity: 0.9;
            margin-bottom: 12px;
            border-radius: 12px;
            filter: drop-shadow(0 0 10px rgba(243,207,101,0.4));
        }
        @media (max-width: 480px) {
            .slot-placeholder img { width: 50px; height: 50px; }
        }
        .slot-placeholder .slot-name { 
            font-size: 14px; 
            color: #f3cf65; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-weight: bold; 
            font-family: 'Cinzel', serif;
        }

        .slot-carta.filled { padding: 0; display: block; }
        .slot-carta.filled .card-flip-box { width: 100%; height: 100%; position: relative; }
        .slot-carta.filled .slot-placeholder { display: none; }

        .card-flip-box { 
            width: 100%; 
            height: 100%; 
            position: relative; 
            transform-style: preserve-3d; 
            transition: transform 0.8s cubic-bezier(0.25, 0.1, 0.1, 1); 
            border-radius: 18px;
        }
        .card-flip-box.is-flipped { transform: rotateY(180deg); }
        .card-side { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            backface-visibility: hidden; 
            border-radius: 18px; 
            overflow: hidden;
            top: 0;
            left: 0;
        }
        .card-side-back { 
            background: linear-gradient(135deg, #2a1a4a, #0f0725);
            display: flex; 
            align-items: center; 
            justify-content: center;
            position: relative;
        }
        .card-side-back::before {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            border: 1px solid rgba(243,207,101,0.2);
            border-radius: 10px;
            pointer-events: none;
        }
        .card-side-back img { 
            width: 60%; 
            height: 60%; 
            object-fit: contain; 
            opacity: 0.95;
            filter: drop-shadow(0 0 15px rgba(243,207,101,0.5));
        }
        .card-side-front { 
            transform: rotateY(180deg); 
            background: #000;
            border-radius: 18px;
            overflow: hidden;
        }
        .card-side-front img { width: 100%; height: 100%; object-fit: cover; }

        /* MAZO DE CARTAS */
        .deck-container { 
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(5px);
            padding: 16px 10px; 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.08);
            margin-bottom: 20px; 
            text-align: center; 
            display: none; 
        }
        .instruccion-baraja { 
            color: #cdbeea; 
            font-size: 11px; 
            text-align: center; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            margin-bottom: 10px;
        }

        .cards-grid { 
            display: flex; 
            flex-wrap: wrap; 
            justify-content: center; 
            gap: 10px; 
            margin-top: 10px; 
            max-height: 400px;
            overflow-y: auto;
            padding: 8px 5px;
        }
        .cards-grid::-webkit-scrollbar {
            width: 3px;
        }
        .cards-grid::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .cards-grid::-webkit-scrollbar-thumb {
            background: #f3cf65;
            border-radius: 10px;
        }

        .mini-card {
            width: 85px;
            height: 128px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            background: linear-gradient(135deg, #2a1a4a, #0f0725);
            border: 1px solid rgba(243,207,101,0.2);
            position: relative;
            flex-shrink: 0;
        }
        .mini-card::before {
            content: "";
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 1px solid rgba(243,207,101,0.1);
            border-radius: 8px;
            pointer-events: none;
        }
        
        @media (max-width: 550px) {
            .mini-card { width: 72px; height: 108px; }
        }
        
        @media (max-width: 400px) {
            .mini-card { width: 65px; height: 98px; }
        }
        
        .mini-card img { 
            width: 38px; 
            height: 38px; 
            object-fit: contain; 
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(243,207,101,0.3));
        }
        
        .mini-card:hover { 
            transform: translateY(-5px) scale(1.02); 
            border-color: rgba(243,207,101,0.5);
            box-shadow: 0 8px 20px rgba(243,207,101,0.2);
        }
        .mini-card.selected { 
            opacity: 0.15; 
            pointer-events: none; 
            transform: scale(0.7);
            filter: blur(2px);
        }

        .mensaje-redireccion {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background: rgba(0,0,0,0.6);
            border-radius: 12px;
            border-left: 3px solid #f3cf65;
            font-size: 12px;
            color: #f3cf65;
            text-align: center;
        }

        /* MENÚ */
        .menu-carrusel {
            margin-top: 20px;
            padding: 16px;
            background: rgba(255,255,255,0.03);
            backdrop-filter: blur(5px);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .carrusel-scroll {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            padding: 8px 5px;
        }
        .carrusel-scroll::-webkit-scrollbar { height: 3px; }
        .carrusel-scroll::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .carrusel-scroll::-webkit-scrollbar-thumb { background: #f3cf65; border-radius: 10px; }
        
        .tarjeta-enlace {
            flex: 0 0 auto;
            scroll-snap-align: center;
            background: rgba(0,0,0,0.3);
            border: 1px solid rgba(243,207,101,0.2);
            border-radius: 16px;
            padding: 12px 20px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
            min-width: 120px;
        }
        .tarjeta-enlace:hover {
            border-color: #f3cf65;
            background: rgba(243,207,101,0.1);
            transform: translateY(-3px);
        }
        .tarjeta-icono { font-size: 22px; color: #f3cf65; }
        .tarjeta-titulo { font-size: 11px; font-weight: bold; color: #f3cf65; letter-spacing: 1px; }
        .tarjeta-subtitulo { font-size: 9px; color: #cdbeea; }
    </style>
</head>

        ];

        var mazoActivo = [], cartaSeleccionada = null;
        var barajando = false;
        var audioCtx = null;
        var vozEspañol = null;

        function iniciarVoz() {
            if (vozEspañol) return;
            var voces = speechSynthesis.getVoices();
            for (var v = 0; v < voces.length; v++) {
                if (voces[v].lang.indexOf('es') === 0) { vozEspañol = voces[v]; break; }
            }
            if (!vozEspañol && voces.length > 0) vozEspañol = voces[0];
        }
        
        function hablarTexto(texto, callback) {
            if (!window.speechSynthesis) return;
            speechSynthesis.cancel();
            iniciarVoz();
            var u = new SpeechSynthesisUtterance(texto);
            u.voice = vozEspañol;
            u.lang = 'es-ES';
            u.rate = 0.85;
            u.pitch = 0.95;
            u.volume = 0.8;
            if (callback) u.onend = callback;
            speechSynthesis.speak(u);
        }
        
        speechSynthesis.onvoiceschanged = function() { iniciarVoz(); };

        function activarAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioCtx.state === 'suspended') audioCtx.resume();
                } catch(e) {}
            }
        }
        
        function sonidoBarajar() {
            try {
                activarAudio();
                if (!audioCtx) return;
                var ahora = audioCtx.currentTime, d = 0.6, bs = audioCtx.sampleRate * d;
                var b = audioCtx.createBuffer(1, bs, audioCtx.sampleRate), data = b.getChannelData(0);
                for (var i = 0; i < bs; i++) data[i] = (Math.random() * 2 - 1) * 0.5;
                for (var r = 0; r < 4; r++) {
                    var s = audioCtx.createBufferSource(), g = audioCtx.createGain(), f = audioCtx.createBiquadFilter();
                    s.buffer = b;
                    f.type = 'bandpass';
                    f.frequency.value = 1800;
                    f.Q.value = 0.6;
                    var ini = ahora + r * 0.3;
                    g.gain.setValueAtTime(0.06, ini);
                    g.gain.linearRampToValueAtTime(0.14, ini + 0.04);
                    g.gain.linearRampToValueAtTime(0.02, ini + 0.12);
                    g.gain.setValueAtTime(0.001, ini + 0.22);
                    s.connect(f);
                    f.connect(g);
                    g.connect(audioCtx.destination);
                    s.start(ini);
                    s.stop(ini + 0.22);
                }
            } catch(e) {}
        }
        
        function sonidoCartaColocada() {
            try {
                activarAudio();
                if (!audioCtx) return;
                var a = audioCtx.currentTime;
                var o = audioCtx.createOscillator(), g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.setValueAtTime(1200, a);
                o.frequency.exponentialRampToValueAtTime(300, a + 0.4);
                g.gain.setValueAtTime(0.2, a);
                g.gain.exponentialRampToValueAtTime(0.001, a + 0.5);
                o.connect(g);
                g.connect(audioCtx.destination);
                o.start(a);
                o.stop(a + 0.5);
                var o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
                o2.type = 'sine';
                o2.frequency.setValueAtTime(800, a + 0.1);
                o2.frequency.exponentialRampToValueAtTime(200, a + 0.5);
                g2.gain.setValueAtTime(0.1, a + 0.1);
                g2.gain.exponentialRampToValueAtTime(0.001, a + 0.6);
                o2.connect(g2);
                g2.connect(audioCtx.destination);
                o2.start(a + 0.1);
                o2.stop(a + 0.6);
            } catch(e) {}
        }

        function barajarArray(a) {
            var arr = a.slice(), c = arr.length, r, t;
            while (c) {
                r = Math.floor(Math.random() * c);
                c--;
                t = arr[c];
                arr[c] = arr[r];
                arr[r] = t;
            }
            return arr;
        }

        function mezclaReal(grid, cb) {
            var cards = Array.from(grid.querySelectorAll('.mini-card')), ciclos = 5, actual = 0;
            var pos = [];
            cards.forEach(function(c, i) { pos.push(i); });
            function ciclo() {
                if (actual >= ciclos) { if(cb) cb(); return; }
                var np = pos.slice();
                for (var i = np.length-1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i+1));
                    var t = np[i];
                    np[i] = np[j];
                    np[j] = t;
                }
                cards.forEach(function(card, idx) {
                    var target = cards[np[idx]];
                    if (card === target) return;
                    var r1 = card.getBoundingClientRect(), r2 = target.getBoundingClientRect();
                    card.style.transition = 'transform 0.25s ease';
                    card.style.transform = 'translate(' + (r2.left-r1.left) + 'px,' + (r2.top-r1.top) + 'px) scale(1.02)';
                    card.style.zIndex = '30';
                });
                setTimeout(function() {
                    var f = document.createDocumentFragment(), ord = [];
                    for (var i = 0; i < np.length; i++) ord.push(cards[np[i]]);
                    ord.forEach(function(c) { f.appendChild(c); });
                    grid.appendChild(f);
                    cards.forEach(function(c) {
                        c.style.transition = 'transform 0.12s ease';
                        c.style.transform = 'translate(0,0) scale(1)';
                        c.style.zIndex = '1';
                    });
                    setTimeout(function() {
                        cards = Array.from(grid.querySelectorAll('.mini-card'));
                        pos = np.slice();
                        actual++;
                        ciclo();
                    }, 120);
                }, 250);
            }
            ciclo();
        }

        function crearSlotCarta() {
            var slot = document.getElementById("slotCarta");
            if (!slot) return;
            slot.innerHTML = '<div class="slot-placeholder"><div class="card-back-texture">' +
                            '<img src="' + ICONO_PIRAMIDE + '">' +
                            '<div class="slot-name">TOMA TU CARTA</div>' +
                            '</div></div>';
        }

        function iniciarTirada() {
            document.getElementById("instruccionesContainer").style.display = "none";
            document.getElementById("anclajeTapete").style.display = "block";
            document.getElementById("anclajeMazo").style.display = "block";
            crearSlotCarta();
            arrancarMazo();
        }

        function arrancarMazo() {
            activarAudio();
            if (barajando) return;
            barajando = true;
            cartaSeleccionada = null;
            var grid = document.getElementById("deckGrid");
            if (!grid) return;
            var sb = document.getElementById("gameStatus"), inst = document.getElementById("instruccionBaraja");
            if (sb) { sb.classList.remove("highlight"); sb.innerHTML = '<i class="fas fa-wind"></i> Mezclando las cartas...'; }
            if (inst) inst.innerHTML = '<i class="fas fa-wind"></i> Mezclando...';
            
            hablarTexto("Mezclando las cartas del oráculo.");
            
            var slot = document.getElementById("slotCarta");
            if (slot) {
                slot.classList.remove("filled");
                slot.innerHTML = '<div class="slot-placeholder"><div class="card-back-texture">' +
                                '<img src="' + ICONO_PIRAMIDE + '">' +
                                '<div class="slot-name">TOMA TU CARTA</div>' +
                                '</div></div>';
            }
            
            var mensajeRedir = document.getElementById("mensajeRedireccion");
            if (mensajeRedir) mensajeRedir.style.display = "none";
            
            mazoActivo = barajarArray(oraculo);
            grid.innerHTML = "";
            
            for (var j = 0; j < mazoActivo.length; j++) {
                var cd = document.createElement("div");
                cd.className = "mini-card";
                cd.id = "deckCard_" + j;
                cd.innerHTML = '<img src="' + ICONO_PIRAMIDE + '">';
                cd.setAttribute("onclick", "clickEnCarta(" + j + ")");
                grid.appendChild(cd);
            }
            
            sonidoBarajar();
            
            mezclaReal(grid, function() {
                barajando = false;
                if (sb) { sb.classList.add("highlight"); sb.innerHTML = '<i class="fas fa-hand-pointer"></i> Elige una carta, la que más te llame la atención.'; }
                if (inst) inst.innerHTML = '<i class="fas fa-hand-pointer"></i> SELECCIONA UNA CARTA';
                hablarTexto("Elige una carta, la que más te llame la atención.");
            });
            grid.scrollIntoView({ behavior: 'smooth' });
        }

        function clickEnCarta(indice) {
            if (barajando || cartaSeleccionada !== null) return;
            var celda = document.getElementById("deckCard_" + indice);
            if (!celda || celda.classList.contains("selected")) return;
            var carta = mazoActivo[indice];
            cartaSeleccionada = carta;
            celda.classList.add("selected");
            
            var slot = document.getElementById("slotCarta");
            if (slot) {
                while (slot.firstChild) slot.removeChild(slot.firstChild);
                slot.classList.add("filled");
                
                var flipBox = document.createElement('div');
                flipBox.className = 'card-flip-box';
                flipBox.id = 'flipBox';
                flipBox.style.width = '100%';
                flipBox.style.height = '100%';
                flipBox.style.position = 'relative';
                
                var backSide = document.createElement('div');
                backSide.className = 'card-side card-side-back';
                backSide.innerHTML = '<img src="' + ICONO_PIRAMIDE + '">';
                
                var frontSide = document.createElement('div');
                frontSide.className = 'card-side card-side-front';
                frontSide.innerHTML = '<img src="' + carta.img + '">';
                
                flipBox.appendChild(backSide);
                flipBox.appendChild(frontSide);
                slot.appendChild(flipBox);
                
                sonidoCartaColocada();
                setTimeout(function() {
                    var tb = document.getElementById("flipBox");
                    if (tb) tb.classList.add("is-flipped");
                }, 150);
            }
            
            var sb = document.getElementById("gameStatus"), inst = document.getElementById("instruccionBaraja");
            if (sb) {
                sb.classList.add("highlight");
                sb.innerHTML = '<i class="fas fa-star"></i> ' + carta.nombre + '<br><span style="font-size:10px;">' + carta.palabrasClave + '</span>';
            }
            if (inst) inst.innerHTML = '<i class="fas fa-check-circle"></i> CARTA REVELADA: ' + carta.nombre;
            
            var mensajeRedir = document.getElementById("mensajeRedireccion");
            mensajeRedir.style.display = "block";
            
            var mensajeVoz = carta.nombre + ". " + carta.palabrasClave + ". En breve serás redirigido a la lectura completa.";
            hablarTexto(mensajeVoz, function() {
                window.location.href = carta.enlace;
            });
            
            document.getElementById("anclajeTapete").scrollIntoView({ behavior: 'smooth' });
        }

        document.getElementById("btnComenzar").onclick = function() {
            iniciarTirada();
        };

        window.onload = function() {
            setTimeout(function() { iniciarVoz(); }, 500);
        };
    </script>
